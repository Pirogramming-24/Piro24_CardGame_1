<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StartPage</title>
</head>
<body>
    {%if messages%}
    {%endif%}
    <form method="POST">
        {%csrf_token%}
        {%for Card in fiveCards%}
        <input type="radio" name="card_radio" id="Card{{Card}}" value={{Card}}>
        <label for="Card{{Card}}">{{Card}}</label>
        {%endfor%}
        <br>
        <select name="defender_radio" required>
            <option value="" disabled selected>----------</option>
            {%for defender in Defenders%}
            <option value={{defender.id}}>{{defender.nickname}}</option>
            {%endfor%}
        </select>
        <button type="submit" name="submit" value="submit">확인</button> 
    </form>
</body>
</html>
