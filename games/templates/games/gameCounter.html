{% extends 'base.html' %}

{% block content %}
    <h1>반격 하기</h1>
    <h3>{{ game.Attacker.nickname }} vs {{ game.Defender.nickname }}</h3>

    <form method="POST">
        {% csrf_token %}
        
        <p>반격 카드를 선택하세요:</p>
        

        {% for card in fiveCards %}
            <label>   
            <input type="radio" name="selected_card" value="{{ card }}" required>
                {{ card }}
            </label>
        {% endfor %}
      

        <br><br>

        <button type="submit">반격하기</button>
    </form>

    <hr>
    
    <a href="{% url 'games:gameList' %}">전체 목록</a>

{% endblock %}
