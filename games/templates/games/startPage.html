{% extends "base.html" %}
{% block content %}

<section class="game-start">
    <div class="game-start-header">
        <h1 class="game-title">카드 선택</h1>
        <p class="game-desc">카드를 선택하고 상대방을 고르세요</p>
    </div>

    <div class="card-box">
        <form method="POST" action="{% url 'games:startPage' %}">
            {% csrf_token %}

            <!-- 카드 선택 -->
            <div class="form-group">
                <label class="label">카드 선택</label>
                <div class="card-options">
                    {% for Card in fiveCards %}
                        <label class="card-radio">
                            <input type="radio" name="card_radio" value="{{ Card }}" required>
                            <span>{{ Card }}</span>
                        </label>
                    {% endfor %}
                </div>
            </div>

            <!-- 구분선 -->
            <div class="divider"></div>
            
            <!-- 상대 선택 -->
            <div class="form-group form-row">
                <label class="label">상대방 선택</label>
                <select name="defender_radio" required>
                    <option value="" disabled selected>선택하세요</option>
                    {% for defender in Defenders %}
                        <option value="{{ defender.id }}">{{ defender.nickname }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn primary">
                공격하기
            </button>
        </form>
    </div>
</section>

{% endblock %}
