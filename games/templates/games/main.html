<!-- {% extends "base.html" %} -->
{% block content %}

<section class="main">
    <div class="main-header">
        <h1 class="main-title">Card Game</h1>
        <p class="main-desc">숫자 카드로 펼치는 배틀 게임</p>
    </div>

    <div class="main-content">
        {% if user.is_authenticated %}
            <!-- 로그인 후 -->
            <div class="welcome">
                {{user.nickname}}님, 환영합니다!
            </div>
    
            <div class="actions">
                <a href="#" class="btn">게임시작</a>
                <a href="#" class="btn">게임목록</a>
            </div>
    
        {% else %}
            <!-- 로그인 전 -->
            <p class="sub">로그인하여 게임을 시작하세요</p>    
        {% endif %}
    </div>
</section>

{% endblock %}
